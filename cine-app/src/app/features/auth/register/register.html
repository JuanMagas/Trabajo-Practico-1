<form (submit)="$event.preventDefault(); enviar()">
  <label>
    Nombre
    <input type="text" [formField]="registerForm.nombre" />
  </label>

  <label>
    Apellido
    <input type="text" [formField]="registerForm.apellido" />
  </label>

  <label>
    Email
    <input type="email" [formField]="registerForm.email" />
  </label>

  <label>
    Contraseña
    <div class="campo-password">
      <input [type]="mostrarPassword() ? 'text' : 'password'" [formField]="registerForm.password" />
      <button
        type="button"
        class="ojo"
        (click)="togglePassword()"
        [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        @if (mostrarPassword()) {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    </div>
  </label>

  <label>
    Confirmar contraseña
    <div class="campo-password">
      <input [type]="mostrarPassword() ? 'text' : 'password'" [formField]="registerForm.confirmarPassword" />
    </div>
    <small class="error" *ngIf="passwordsNoCoinciden()">Las contraseñas no coinciden</small>
  </label>

  <label>
    Fecha de nacimiento
    <input type="date" [formField]="registerForm.fechaNacimiento" />
  </label>

  <label>
    Tipo de sangre
    <select [formField]="registerForm.tipoSangre">
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>
  </label>

  <label>
    Color de ojos
    <input type="text" [formField]="registerForm.colorOjos" />
  </label>

  <label>
    Días de vacaciones por año
    <input type="number" [formField]="registerForm.diasVacaciones" />
  </label>

  <button type="submit" [disabled]="cargando()">
    {{ cargando() ? 'Registrando...' : 'Registrarme' }}
  </button>

  <p *ngIf="errorMsg()">{{ errorMsg() }}</p>
</form>
